<!doctype html>
<html lang="es-419">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cerca de este volante · Ronda</title>
    <meta
      name="description"
      content="Rondas a pocas cuadras de acá: grupos de 5 o 6 vecinos que se juntan una vez por semana."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#fffefa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1320" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="/assets/ronda.css" />
    <link rel="modulepreload" href="/assets/ronda.js" />
    <script type="module" src="/assets/volante.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="/">
          <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="4.6" r="2.9" />
            <circle cx="19" cy="9.7" r="2.9" />
            <circle cx="16.3" cy="17.9" r="2.9" />
            <circle cx="7.7" cy="17.9" r="2.9" />
            <circle cx="5" cy="9.7" r="2.9" />
          </svg>
          Ronda
        </a>
      </div>
    </header>
    <main class="page">
      <header class="masthead">
        <h1 data-t="landingTitle">Cerca de este volante</h1>
        <p class="lead" data-t="landingLead">
          Rondas a pocas cuadras de acá: grupos de 5 o 6 vecinos que se juntan una vez por semana,
          siempre en lugares públicos.
        </p>
      </header>

      <section id="results" aria-live="polite">
        <p class="status" data-t="loading">Cargando…</p>
      </section>

      <a class="button" href="/app/" data-t="join">Quiero sumarme</a>
      <p class="note" data-t="joinNote">Funciona en el navegador; no hace falta bajar nada.</p>

      <section id="bus" hidden></section>

      <div class="privacy">
        <p class="note" data-t="noNames">No mostramos nombres ni lugares exactos.</p>
        <a class="text-link" href="/" data-t="allBarrios">Ver todos los barrios</a>
      </div>
      <noscript><p class="status">Esta página necesita JavaScript para mostrar las rondas.</p></noscript>
    </main>
  </body>
</html>
