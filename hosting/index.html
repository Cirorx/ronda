<!doctype html>
<html lang="es-419">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cerca tuyo · Ronda</title>
    <meta
      name="description"
      content="Grupos de 5 o 6 vecinos que se juntan una vez por semana, siempre en lugares públicos."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <meta name="theme-color" content="#fffefa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1320" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="/assets/ronda.css" />
    <link rel="modulepreload" href="/assets/ronda.js" />
    <script type="module" src="/assets/cerca.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="/" aria-current="page">
          <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="4.6" r="2.9" />
            <circle cx="19" cy="9.7" r="2.9" />
            <circle cx="16.3" cy="17.9" r="2.9" />
            <circle cx="7.7" cy="17.9" r="2.9" />
            <circle cx="5" cy="9.7" r="2.9" />
          </svg>
          Ronda
        </a>
      </div>
    </header>
    <main class="page">
      <header class="masthead">
        <h1 data-t="cercaTitle">Cerca tuyo</h1>
        <p class="lead" data-t="cercaLead">
          Grupos de 5 o 6 vecinos que se juntan una vez por semana, siempre en lugares públicos.
        </p>
      </header>

      <label for="barrio" data-t="barrioLabel">¿En qué barrio estás?</label>
      <select id="barrio" name="barrio">
        <option value="" data-t="barrioPick">Elegí tu barrio</option>
        <optgroup label="Ciudad de la Costa">
          <option value="shangrila">Shangrilá</option>
          <option value="san-jose-de-carrasco">San José de Carrasco</option>
          <option value="lagomar-sur">Lagomar Sur</option>
          <option value="lagomar-norte">Lagomar Norte</option>
          <option value="solymar-sur">Solymar Sur</option>
          <option value="solymar-norte">Solymar Norte</option>
          <option value="lomas-de-solymar">Lomas de Solymar</option>
          <option value="el-pinar-sur">El Pinar Sur</option>
          <option value="el-pinar-norte">El Pinar Norte</option>
        </optgroup>
        <optgroup label="Montevideo">
          <option value="aguada">Aguada</option>
          <option value="aires-puros">Aires Puros</option>
          <option value="atahualpa">Atahualpa</option>
          <option value="banados-de-carrasco">Bañados de Carrasco</option>
          <option value="barrio-sur">Barrio Sur</option>
          <option value="belvedere">Belvedere</option>
          <option value="brazo-oriental">Brazo Oriental</option>
          <option value="buceo">Buceo</option>
          <option value="capurro-bella-vista">Capurro y Bella Vista</option>
          <option value="carrasco">Carrasco</option>
          <option value="carrasco-norte">Carrasco Norte</option>
          <option value="casabo-pajas-blancas">Casabó y Pajas Blancas</option>
          <option value="casavalle">Casavalle</option>
          <option value="castro-perez-castellanos">Castro y Pérez Castellanos</option>
          <option value="centro">Centro</option>
          <option value="cerrito">Cerrito</option>
          <option value="cerro">Cerro</option>
          <option value="ciudad-vieja">Ciudad Vieja</option>
          <option value="colon-centro-noroeste">Colón Centro y Noroeste</option>
          <option value="colon-sureste-abayuba">Colón Sureste y Abayubá</option>
          <option value="conciliacion">Conciliación</option>
          <option value="cordon">Cordón</option>
          <option value="flor-de-maronas">Flor de Maroñas</option>
          <option value="ituzaingo">Ituzaingó</option>
          <option value="jacinto-vera">Jacinto Vera</option>
          <option value="jardines-del-hipodromo">Jardines del Hipódromo</option>
          <option value="la-blanqueada">La Blanqueada</option>
          <option value="la-comercial">La Comercial</option>
          <option value="la-figurita">La Figurita</option>
          <option value="la-paloma-tomkinson">La Paloma y Tomkinson</option>
          <option value="la-teja">La Teja</option>
          <option value="larranaga">Larrañaga</option>
          <option value="las-acacias">Las Acacias</option>
          <option value="las-canteras">Las Canteras</option>
          <option value="lezica-melilla">Lezica y Melilla</option>
          <option value="malvin">Malvín</option>
          <option value="malvin-norte">Malvín Norte</option>
          <option value="manga">Manga</option>
          <option value="manga-toledo-chico">Manga y Toledo Chico</option>
          <option value="maronas-parque-guarani">Maroñas y Parque Guaraní</option>
          <option value="mercado-modelo-bolivar">Mercado Modelo y Bolívar</option>
          <option value="nuevo-paris">Nuevo París</option>
          <option value="palermo">Palermo</option>
          <option value="parque-batlle-villa-dolores">Parque Batlle y Villa Dolores</option>
          <option value="parque-rodo">Parque Rodó</option>
          <option value="paso-de-la-arena">Paso de la Arena</option>
          <option value="paso-de-las-duranas">Paso de las Duranas</option>
          <option value="penarol-lavalleja">Peñarol y Lavalleja</option>
          <option value="piedras-blancas">Piedras Blancas</option>
          <option value="pocitos">Pocitos</option>
          <option value="prado-nueva-savona">Prado y Nueva Savona</option>
          <option value="punta-carretas">Punta Carretas</option>
          <option value="punta-de-rieles-bella-italia">Punta de Rieles y Bella Italia</option>
          <option value="punta-gorda">Punta Gorda</option>
          <option value="reducto">Reducto</option>
          <option value="sayago">Sayago</option>
          <option value="tres-cruces">Tres Cruces</option>
          <option value="tres-ombues-pueblo-victoria">Tres Ombúes y Pueblo Victoria</option>
          <option value="union">Unión</option>
          <option value="villa-espanola">Villa Española</option>
          <option value="villa-garcia-manga-rural">Villa García y Manga Rural</option>
          <option value="villa-munoz-retiro">Villa Muñoz y Retiro</option>
        </optgroup>
      </select>

      <section id="results" aria-live="polite"></section>

      <a class="button" href="/app/bienvenida" data-t="join">Quiero sumarme</a>
      <p class="note" data-t="joinNote">Funciona en el navegador; no hace falta bajar nada.</p>

      <div class="privacy">
        <p class="note" data-t="noNames">No mostramos nombres ni lugares exactos.</p>
        <p class="note" data-t="exactPlace">
          El lugar exacto te lo mostramos el día antes, cuando confirmás.
        </p>
      </div>
      <noscript><p class="status">Esta página necesita JavaScript para mostrar los grupos.</p></noscript>
    </main>
  </body>
</html>
