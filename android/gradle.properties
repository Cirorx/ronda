org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Built-in Kotlin (AGP 9): AGP compiles the app's and the plugins' Kotlin, and FlutterFire skips
# its own `apply plugin: 'kotlin-android'`. Needs Flutter 3.47+. Flutter's "plugins that apply KGP"
# warning still lists them: it matches the build.gradle text (docs/STACK.md, gotcha 7).
android.builtInKotlin=true
# Stays false: Flutter 3.47.8's Gradle plugin still casts `android` to the old DSL and fails to
# apply with the new one.
android.newDsl=false
