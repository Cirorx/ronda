[project]
name = "ronda-scripts"
version = "0.1.0"
description = "Seed and reset the Firebase emulators with Ronda's invented demo data."
requires-python = ">=3.13,<3.14"
# Keep in step with the inline `# /// script` blocks of seed.py and reset.py (a test checks).
dependencies = [
    "google-cloud-firestore>=2.21,<3",
    "ortools==9.15.6755",
    "protobuf==6.33.6",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# ortools' protobuf bindings use `~` on a bool at import time (Python 3.13 deprecation).
filterwarnings = ["ignore:Bitwise inversion:DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
allowed-confusables = ["×"]  # barrio × pretext × slot, as in docs/GLOSSARY.md
