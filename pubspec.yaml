name: ronda
description: Weekly groups of neighbours, a few blocks from home.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  auth_repository:
    path: packages/auth_repository
  bloc: ^9.2.1
  bloc_concurrency: ^0.3.0
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  device_store:
    path: packages/device_store
  equatable: ^2.0.7
  face_blur:
    path: packages/face_blur
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  firebase_storage: ^14.0.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flyer_repository:
    path: packages/flyer_repository
  formz: ^0.8.1
  go_router: ^18.1.1
  intl: ^0.20.2
  material_ui: ^1.8.0
  needs_repository:
    path: packages/needs_repository
  onboarding_repository:
    path: packages/onboarding_repository
  organiser_repository:
    path: packages/organiser_repository
  profile_repository:
    path: packages/profile_repository
  push_client:
    path: packages/push_client
  push_repository:
    path: packages/push_repository
  ronda_api:
    path: packages/ronda_api
  ronda_repository:
    path: packages/ronda_repository
  ronda_ui:
    path: packages/ronda_ui
  share_sheet:
    path: packages/share_sheet
  url_launcher: ^6.3.3
  voice_recorder:
    path: packages/voice_recorder

dev_dependencies:
  bloc_lint: ^0.4.3
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.24
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
