# Tooling for the functions' tests and lint only: Cloud Functions installs requirements.txt,
# and the venv the emulator and deploy use is functions/venv (docs/STACK.md).
#
#   uv venv --seed --python 3.13 venv
#   VIRTUAL_ENV=venv uv pip install -r requirements.txt -r requirements-dev.txt
#   venv/bin/pytest --cov && venv/bin/ruff check . && venv/bin/ruff format --check .

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# ortools' protobuf bindings use `~` on a bool at import time (Python 3.13 deprecation).
# firebase-admin 7 deprecates `Message.token` for installation ids; the app still saves
# registration tokens (docs/STACK.md § Push), so the sender addresses those.
filterwarnings = [
    "ignore:Bitwise inversion:DeprecationWarning",
    "ignore:Message.token is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["proposals", "main", "voice_signup", "audio_sweeper", "cerca_tuyo", "mate_flyer", "rsvp", "jobs", "fcm", "seguimos", "rain", "organiser"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["venv", "ronda_solver"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
allowed-confusables = ["×"]  # barrio × pretext × slot, as in docs/GLOSSARY.md
