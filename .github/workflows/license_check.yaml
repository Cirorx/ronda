name: license_check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
    paths:
      - "pubspec.yaml"
      - ".github/workflows/license_check.yaml"
  push:
    branches:
      - main
    paths:
      - "pubspec.yaml"
      - ".github/workflows/license_check.yaml"

jobs:
  license_check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/license_check.yml@v2
    with:
      # v2 runs `dart pub get` unless told this is a Flutter package.
      flutter_version: "3.47.x"
      allowed: "MIT,BSD-3-Clause,BSD-2-Clause,Apache-2.0"
      # pubspec_lock_parse: dev-only, via bloc_lint. Its LICENSE is Apache-2.0,
      # in a layout pub.dev can't classify, so the check reads it as "unknown".
      # dbus: MPL-2.0, pulled in only by flutter_local_notifications_linux.
      # Ronda has no linux/ app, so it never ships in a build.
      skip_packages: "pubspec_lock_parse,dbus"
