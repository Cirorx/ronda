name: ronda

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  semantic-pull-request:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@v2

  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v2
    with:
      flutter_version: "3.47.x"
      run_bloc_lint: true
      min_coverage: 90
      coverage_excludes: "lib/l10n/gen/*.dart"
      # The generated Firebase options are git-ignored; stand in fake ones.
      setup: |
        cp tool/firebase_options_stub.dart lib/firebase_options_development.dart
        cp tool/firebase_options_stub.dart lib/firebase_options_production.dart

  packages:
    strategy:
      matrix:
        package:
          - packages/auth_repository
          - packages/device_store
          - packages/needs_repository
          - packages/profile_repository
          - packages/ronda_api
          - packages/ronda_repository
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v2
    with:
      flutter_version: "3.47.x"
      working_directory: ${{ matrix.package }}

  ronda_ui:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v2
    with:
      flutter_version: "3.47.x"
      working_directory: packages/ronda_ui
      # Goldens are recorded on macOS; Linux renders text differently.
      runs_on: macos-latest

  solver:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solver
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov

  # Demo seed and reset; the emulator tests skip here (no emulator hosts in CI).
  scripts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  # propose_groups and approve_proposal, over an in-memory Firestore.
  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv venv --python 3.13 venv
      - run: VIRTUAL_ENV=venv uv pip install -r requirements.txt -r requirements-dev.txt
      - run: venv/bin/ruff check .
      - run: venv/bin/ruff format --check .
      - run: venv/bin/pytest --cov

  # firestore.rules on the Firestore emulator (needs Java).
  rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rules
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx --yes firebase-tools@15.34.1 emulators:exec --only firestore --project demo-ronda-rules "node --test"

  spell-check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/spell_check.yml@v2
    with:
      includes: |
        **/*.md
      modified_files_only: false
