name: face_blur
description: Takes a photo and pixelates the faces in it on the phone, with ML Kit face detection (detection only).
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  google_mlkit_face_detection: ^0.15.1
  image: ^4.12.0
  image_picker: ^1.2.4
  path_provider: ^2.1.6

dev_dependencies:
  flutter_image_compress_common: ^1.1.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  very_good_analysis: ^11.0.0
