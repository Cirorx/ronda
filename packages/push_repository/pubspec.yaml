  cloud_functions: ^7.0.1
  fake_async: ^1.3.3
  fake_cloud_firestore: ^4.5.0
  firebase_storage: ^14.0.1
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0
