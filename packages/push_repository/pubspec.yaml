version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  device_store:
    path: ../device_store
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  push_client:
    path: ../push_client
  ronda_api:
