name: ronda_ui
description: Ronda's theme tokens and shared components.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  cupertino_ui: ^1.1.4
  flutter:
    sdk: flutter
  material_ui: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

  # Fonts are bundled, never fetched (docs/DESIGN.md § In Flutter). Both are
  # OFL 1.1, from github.com/google/fonts; registerRondaUiLicenses() adds the
  # two notices to the app's licence page.
  fonts:
    - family: YoungSerif
      fonts:
        - asset: assets/fonts/YoungSerif-Regular.ttf
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700

  assets:
    - assets/fonts/OFL-YoungSerif.txt
    - assets/fonts/OFL-AtkinsonHyperlegible.txt
