    path: ../face_blur
  flutter:
    sdk: flutter
  ronda_api:
    path: ../ronda_api

dev_dependencies:
  cloud_functions: ^7.0.1
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0
