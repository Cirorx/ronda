name: voice_recorder
description: Records a voice note as a WAV, 16 kHz mono 16-bit, on every platform.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  cross_file: ^0.3.5+5
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  record: ^7.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  very_good_analysis: ^11.0.0
