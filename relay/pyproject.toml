# The relay's tests and lint only: Cloud Run installs requirements.txt (docs/STACK.md).
#
#   uv venv --seed --python 3.13 venv
#   VIRTUAL_ENV=venv uv pip install -r requirements.txt -r requirements-dev.txt
#   venv/bin/pytest --cov && venv/bin/ruff check . && venv/bin/ruff format --check .

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["main"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
